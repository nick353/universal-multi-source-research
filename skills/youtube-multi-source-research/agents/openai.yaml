interface:
  display_name: "Universal Multi-Source Research"
  short_description: "Cross-platform research from topics and URLs"
  default_prompt: "Automatically use this Skill for an unqualified request such as リサーチして、調査して、 or 調べて; the user does not need to name the Skill or approve each source. Choose the research depth, perform live read-only retrieval across every relevant configured source including YouTube, X, Reddit, and ordinary Web, validate source-native evidence before claiming completion, put coverage and counts first, show script-ready YouTube transcript materials, save the cited brief locally, and report any setup or blocker."
policy:
  allow_implicit_invocation: true
